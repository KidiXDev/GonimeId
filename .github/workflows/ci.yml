name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.1'
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify go.mod is tidy
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # gofmt, go vet, gosec and go-critic all run inside golangci-lint (see .golangci.yml)
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test
        shell: bash
        run: go test -short -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: Regression gates
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Blogger proxy readiness: repeat to shake out races
          go test -short -count=10 ./internal/player \
            -run '^(TestStartBloggerProxyServer|TestBloggerProxyClientSupportsHTTP11TLS)$'

          # Goroutine leak gate (Go 1.27 goroutineleak profile). Runs without -race:
          # the detector needs a plain GC cycle.
          go test -count=1 ./internal/util/leakcheck/... ./test/leak/...

          # encoding/json/v2 migration guard: jsonx must decode like encoding/json
          go test ./internal/util/jsonx/ -run FuzzUnmarshalMatchesV1 \
            -fuzz FuzzUnmarshalMatchesV1 -fuzztime 45s
          go test ./internal/util/jsonx/ -run FuzzUnmarshalStructMatchesV1 \
            -fuzz FuzzUnmarshalStructMatchesV1 -fuzztime 45s

      - name: Coverage floor (66%)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go tool cover -func=coverage.out | awk '
            /^total:/ { sub(/%$/, "", $3); if ($3 + 0 < 66.0) { print "coverage " $3 "% < 66%"; exit 1 } }'

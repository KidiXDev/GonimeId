name: Release

# Triggered by pushing a tag like v1.9.0 or v1.9.0-beta.1 (a "-" marks a pre-release).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.1'
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -short -race -count=1 ./...

  # Native CGO builds (SQLite) on each platform. Asset names are what
  # internal/updater looks for — keep them stable.
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64, runner: ubuntu-latest,    cc: gcc }
          - { os: linux,   arch: arm64, runner: ubuntu-24.04-arm, cc: gcc }
          - { os: darwin,  arch: amd64, runner: macos-15,         cc: clang }
          - { os: darwin,  arch: arm64, runner: macos-latest,     cc: clang }
          - { os: windows, arch: amd64, runner: windows-latest,   cc: gcc, ext: .exe }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install MinGW (Windows)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - if: matrix.os == 'windows'
        shell: bash
        run: echo 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: |
          VERSION=${GITHUB_REF_NAME}
          PKG=github.com/KidiXDev/GonimeId/internal/version
          go build -trimpath \
            -ldflags "-s -w -X $PKG.Version=$VERSION -X $PKG.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X $PKG.Commit=$(git rev-parse --short HEAD)" \
            -o "dist/gonimeid-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}" ./cmd/gonimeid

      - uses: actions/upload-artifact@v7
        with:
          name: gonimeid-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 1

  macos-universal:
    name: macOS universal binary
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: gonimeid-darwin-*
          merge-multiple: true
      - run: |
          lipo -create gonimeid-darwin-amd64 gonimeid-darwin-arm64 -output gonimeid-darwin-universal
          lipo -info gonimeid-darwin-universal
      - uses: actions/upload-artifact@v7
        with:
          name: gonimeid-darwin-universal
          path: gonimeid-darwin-universal
          retention-days: 1

  windows-installer:
    name: Windows installer
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: gonimeid-windows-amd64
          path: build/staging

      - name: Stage binary + bundled mpv
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          mv build/staging/gonimeid-windows-amd64.exe build/staging/gonimeid.exe
          mkdir -p build/staging/bin mpv
          # Official recommended Windows build; skip the -v3 and -dev variants.
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern 'mpv-x86_64-[0-9]*.7z' --dir mpv
          7z x mpv/*.7z -ompv/x -y >/dev/null
          d=$(dirname "$(find mpv/x -name mpv.exe | head -1)")
          cp "$d"/mpv.exe "$d"/*.dll build/staging/bin/
          build/staging/bin/mpv.exe --version | head -1

      - name: Build installer
        shell: bash
        run: |
          sed -i "s/^#define MyAppVersion .*/#define MyAppVersion \"${GITHUB_REF_NAME#v}\"/" build/install.iss
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" build/install.iss
          ls dist/GonimeId-Installer-*.exe

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/GonimeId-Installer-*.exe
          retention-days: 1

  release:
    name: Publish release
    needs: [build, macos-universal, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Package assets
        run: |
          cd release
          rm -f gonimeid-darwin-amd64 gonimeid-darwin-arm64   # lipo inputs only
          for f in gonimeid-linux-* gonimeid-darwin-*; do
            chmod +x "$f" && tar -czf "$f.tar.gz" "$f"
          done
          zip gonimeid-windows-amd64.zip gonimeid-windows-amd64.exe
          rm gonimeid-windows-amd64.exe
          sha256sum * > checksums-sha256.txt
          ls -la

      - uses: softprops/action-gh-release@v3
        with:
          name: GonimeId ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release/*
          body: |
            ### Install

            **Linux / macOS**
            ```bash
            curl -LO https://github.com/KidiXDev/GonimeId/releases/download/${{ github.ref_name }}/gonimeid-linux-amd64.tar.gz
            tar -xzf gonimeid-linux-amd64.tar.gz
            sudo install gonimeid-linux-amd64 /usr/local/bin/gonimeid
            ```
            macOS: use `gonimeid-darwin-universal` (Intel + Apple Silicon).

            **Windows** — run `GonimeId-Installer-${{ github.ref_name }}.exe` (bundles mpv), or unzip the portable `gonimeid-windows-amd64.zip`.

            Verify: `sha256sum -c checksums-sha256.txt`
